<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Airdrop Radarı</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #58a6ff; text-align: center; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; margin-bottom: 15px; cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .card:hover { border-color: #58a6ff; }
        .score { font-size: 24px; font-weight: bold; color: #3fb950; background: #23863622; padding: 10px; border-radius: 50%; }
        
        /* Detay Modalı (Başlangıçta Gizli) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal { background-color: #161b22; border: 1px solid #30363d; padding: 25px; border-radius: 10px; max-width: 600px; width: 90%; }
        .action-plan { background: #0d1117; padding: 15px; border-left: 4px solid #f2cc60; margin: 15px 0; font-family: monospace; }
        
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 10px; }
        .btn-success { background-color: #238636; color: white; }
        .btn-archive { background-color: #8b949e; color: white; }
        .btn-close { background-color: transparent; color: #f85149; border: 1px solid #f85149; float: right;}
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Aktif Airdrop Fırsatları</h1>
    <div id="airdrop-list">Yükleniyor...</div>
</div>

<!-- Tıklayınca Açılacak Detay Ekranı -->
<div class="modal-overlay" id="modal">
    <div class="modal">
        <button class="btn btn-close" onclick="closeModal()">Kapat X</button>
        <h2 id="m-title">Proje Adı</h2>
        <p><strong>Tür:</strong> <span id="m-type"></span> | <strong>Puan:</strong> <span id="m-score" style="color:#3fb950"></span>/100</p>
        <p><strong>Yapay Zeka Analizi:</strong> <span id="m-reason"></span></p>
        <div class="action-plan">
            <strong>Adım Adım Katılım:</strong><br><br>
            <span id="m-action"></span>
        </div>
        <div style="margin-top: 20px;">
            <button class="btn btn-success" id="btn-katildim">✅ Katıldım</button>
            <button class="btn btn-archive" id="btn-arsivle">🗑️ Arşivle</button>
        </div>
    </div>
</div>

<script>
    let airdrops = [];
    // Tarayıcı hafızasından silinen/katılınan airdropları çek
    let hiddenAirdrops = JSON.parse(localStorage.getItem('hiddenAirdrops')) || [];
    let currentSelectedName = "";

    // JSON verisini çek
    fetch('airdrops.json')
        .then(response => response.json())
        .then(data => {
            airdrops = data;
            renderList();
        })
        .catch(err => document.getElementById('airdrop-list').innerHTML = "Henüz onaylanmış bir airdrop bulunamadı.");

    function renderList() {
        const listDiv = document.getElementById('airdrop-list');
        listDiv.innerHTML = '';
        
        // Gizlenmemiş (hiddenAirdrops içinde olmayan) airdropları filtrele
        const visibleAirdrops = airdrops.filter(a => !hiddenAirdrops.includes(a.project_name));

        if (visibleAirdrops.length === 0) {
            listDiv.innerHTML = "<p style='text-align:center;'>Şu an aktif bir airdrop görevi yok. AI çalışmaya devam ediyor! ☕</p>";
            return;
        }

        visibleAirdrops.forEach(opp => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openModal(opp);
            card.innerHTML = `
                <div>
                    <h3 style="margin:0 0 5px 0;">${opp.project_name}</h3>
                    <small style="color:#8b949e">${opp.opportunity_type} | ${opp.date_added}</small>
                </div>
                <div class="score">${opp.airdrop_score}</div>
            `;
            listDiv.appendChild(card);
        });
    }

    function openModal(opp) {
        currentSelectedName = opp.project_name;
        document.getElementById('m-title').innerText = opp.project_name;
        document.getElementById('m-type').innerText = opp.opportunity_type;
        document.getElementById('m-score').innerText = opp.airdrop_score;
        document.getElementById('m-reason').innerText = opp.reasoning;
        document.getElementById('m-action').innerText = opp.action_plan;
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
    }

    function hideCurrentAirdrop() {
        if (!hiddenAirdrops.includes(currentSelectedName)) {
            hiddenAirdrops.push(currentSelectedName);
            localStorage.setItem('hiddenAirdrops', JSON.stringify(hiddenAirdrops));
        }
        closeModal();
        renderList(); // Listeyi yenile, projeyi ekrandan sil
    }

    // Buton Dinleyicileri
    document.getElementById('btn-katildim').onclick = hideCurrentAirdrop;
    document.getElementById('btn-arsivle').onclick = hideCurrentAirdrop;
</script>

</body>
</html>
