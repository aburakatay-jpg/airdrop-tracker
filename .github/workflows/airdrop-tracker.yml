name: Airdrop Tracker

on:
  schedule:
    - cron: '0 6 * * *'  # Her gün 09:00 TR saati (UTC+3)
  workflow_dispatch:       # Manuel çalıştırma butonu

# ... (Üst kısımdaki on: cron ayarları vb. aynı kalacak) ...

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları Çek (Checkout)
        uses: actions/checkout@v4
        
      - name: Python'u Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # veya kullandığın sürüm

      - name: Kütüphaneleri Yükle (İŞTE SENİN TERMİNALİN BURASI)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sistemi Çalıştır
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: seen.json Dosyasını Kaydet (Spam'i Önlemek İçin Çok Önemli)
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add data/seen.json
          # Eğer seen.json'da değişiklik varsa (yeni proje eklendiyse) kaydet ve GitHub'a yolla
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik güncelleme: Yeni projeler seen.json'a eklendi" && git push)
