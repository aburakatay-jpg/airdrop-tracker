name: Airdrop Tracker

on:
  schedule:
    - cron: '0 6 * * *'  # Her gün 09:00 TR saati (UTC+3)
  workflow_dispatch:       # Manuel çalıştırma butonu

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları yükle
        run: pip install requests

      - name: Tracker'ı çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py
        
      - name: Seen.json güncelle
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/seen.json
          git diff --staged --quiet || git commit -m "chore: seen.json güncellendi"
          git push