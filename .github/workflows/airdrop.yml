name: Airdrop Radar V2

on:
  workflow_dispatch:

  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  run-airdrop-radar:
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      MIN_AIRDROP_SCORE: "45"
      MIN_FREE_SCORE: "80"
      MAX_CANDIDATES_PER_RUN: "60"

    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Airdrop Radar çalıştır
        run: |
          python main.py

      - name: Üretilen verileri commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/seen.json
          git add data/projects.json
          git add docs/airdrops.json

          if git diff --cached --quiet; then
            echo "Commit edilecek değişiklik yok."
          else
            git commit -m "Update airdrop radar data"
            git push
          fi
